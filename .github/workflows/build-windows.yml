name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: KDE Craft / Windows x64
    runs-on: windows-2022
    timeout-minutes: 330

    env:
      # A physically short root lets us avoid Craft's Windows junction-path
      # regression while keeping paths below the legacy Windows limit.
      CRAFT_ROOT: C:\C
      CRAFT_PACKAGE: kde/kdemultimedia/kdenlive
      PYTHONUTF8: "1"

    steps:
      - name: Check out the public source commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bootstrap requirements
        shell: pwsh
        run: python -m pip install --disable-pip-version-check --upgrade certifi

      - name: Bootstrap KDE Craft
        shell: pwsh
        run: |
          $bootstrap = Join-Path $env:RUNNER_TEMP "CraftBootstrap.py"
          $craftSource = Join-Path $env:RUNNER_TEMP "craft-source"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/KDE/craft/master/setup/CraftBootstrap.py" -OutFile $bootstrap

          git config --global core.longpaths true
          git clone --depth 1 https://invent.kde.org/packaging/craft.git $craftSource
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Current Craft recreates C:\_ junctions between configure and make.
          # Autotools-generated makefiles retain the first junction path and
          # then fail because it no longer points to their source tree. With a
          # short physical root no junction is needed, so disable only that
          # path alias in the public bootstrap source.
          $shortPathModule = Join-Path $craftSource "bin\Utils\CraftShortPath.py"
          $source = Get-Content -LiteralPath $shortPathModule -Raw
          $needle = "_useShortpaths = OsUtils.isWin()"
          if (-not $source.Contains($needle)) {
            throw "Unable to locate Craft's Windows short-path setting."
          }
          Set-Content -LiteralPath $shortPathModule -Value $source.Replace($needle, "_useShortpaths = False") -Encoding utf8

          # The current MSVC autotools shadow build loses absolute source
          # prerequisites between configure and make for a small set of
          # dependencies on hosted runners. Keep the normal Craft layout for
          # everything else, notably gettext, whose Windows link configuration
          # depends on its shadow build.
          $autotoolsModule = Join-Path $craftSource "bin\BuildSystem\AutoToolsBuildSystem.py"
          $autotoolsSource = (Get-Content -LiteralPath $autotoolsModule -Raw) -replace "`r`n", "`n"
          $autotoolsNeedle = '        BuildSystemBase.__init__(self, package, "autotools")'
          if (-not $autotoolsSource.Contains($autotoolsNeedle)) {
            throw "Unable to locate Craft's autotools initialization."
          }
          $autotoolsReplacement = "$autotoolsNeedle`n        if CraftCore.compiler.isWindows and package.path in (`"dev-utils/pkgconf`", `"libs/libb2`", `"libs/openssl`", `"libs/icu`", `"libs/libunistring`", `"libs/libffi`"):`n            self.subinfo.options.useShadowBuild = False"
          $autotoolsSource = $autotoolsSource.Replace($autotoolsNeedle, $autotoolsReplacement)

          # ICU 78 can select its prebuilt data archive without emitting the
          # dirs.timestamp rule that its Windows resource target still needs.
          # Recreate exactly that generated marker after the in-source clean.
          $makeNeedle = "        if not self.subinfo.options.useShadowBuild:`n            if not self.shell.execute(self.buildDir(), self.makeProgram, `"clean`"):`n                return False"
          if (-not $autotoolsSource.Contains($makeNeedle)) {
            throw "Unable to locate Craft's autotools make preparation."
          }
          $makeReplacement = "$makeNeedle`n        if CraftCore.compiler.isWindows and self.package.path == `"libs/icu`":`n            data_tmp = self.sourceDir() / `"data`" / `"out`" / `"tmp`"`n            data_tmp.mkdir(parents=True, exist_ok=True)`n            (data_tmp / `"dirs.timestamp`").write_text(`"timestamp\n`", encoding=`"utf-8`")`n        if CraftCore.compiler.isMSVC() and self.package.path == `"libs/gettext`":`n            gettext_makefile = self.buildDir() / `"gettext-tools`" / `"gnulib-lib`" / `"Makefile`"`n            with gettext_makefile.open(`"a`", encoding=`"utf-8`") as stream:`n                stream.write(`"\nlibgettextlib_la_LIBADD += -liconv\n`")"
          Set-Content -LiteralPath $autotoolsModule -Value $autotoolsSource.Replace($makeNeedle, $makeReplacement) -Encoding utf8

          # Craft's MSVC gettext recipe intends to disable the printf %n
          # probe because the resulting tools crash on Windows. A missing
          # comma currently joins that cache entry to the preceding one, so
          # neither value reaches configure. Repair only that public recipe.
          $gettextBlueprint = Join-Path $craftSource "blueprints\libs\gettext\gettext.py"
          $gettextSource = (Get-Content -LiteralPath $gettextBlueprint -Raw) -replace "`r`n", "`n"
          $gettextBroken = '                "ac_cv_func_memmove=yes"' + "`n" + '                # The following are required for a full gettext built (libintl and tools).'
          $gettextFixed = '                "ac_cv_func_memmove=yes",' + "`n" + '                # The following are required for a full gettext built (libintl and tools).'
          if ($gettextSource.Contains($gettextBroken)) {
            $gettextSource = $gettextSource.Replace($gettextBroken, $gettextFixed)
          } elseif (-not $gettextSource.Contains($gettextFixed)) {
            throw "Unable to validate Craft's gettext MSVC cache options."
          }
          Set-Content -LiteralPath $gettextBlueprint -Value $gettextSource -Encoding utf8

          python $bootstrap --prefix $env:CRAFT_ROOT --use-defaults --localDev $craftSource
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Select stable gettext host tools
        shell: pwsh
        run: |
          # The MSVC gettext libraries produced by the current Craft recipe
          # build successfully, but its command-line tools terminate with a
          # Windows fast-fail when another dependency invokes them. Craft has
          # already installed the official MSYS gettext host tools, so expose
          # only those tools ahead of C:\C\bin while keeping every compiler and
          # target library on the native MSVC toolchain.
          $msysBin = Join-Path $env:CRAFT_ROOT "msys\usr\bin"
          $shimDir = Join-Path $env:RUNNER_TEMP "firaw-gettext-tools"
          New-Item -ItemType Directory -Path $shimDir -Force | Out-Null

          $toolNames = @(
            "envsubst", "gettext", "msgattrib", "msgcat", "msgcmp",
            "msgcomm", "msgconv", "msgen", "msgexec", "msgfilter",
            "msgfmt", "msggrep", "msginit", "msgmerge", "msgunfmt",
            "msguniq", "ngettext", "xgettext"
          )
          foreach ($toolName in $toolNames) {
            $target = Join-Path $msysBin "$toolName.exe"
            if (Test-Path -LiteralPath $target) {
              $shim = Join-Path $shimDir "$toolName.cmd"
              $body = "@echo off`r`n`"$target`" %*`r`nexit /b %ERRORLEVEL%`r`n"
              Set-Content -LiteralPath $shim -Value $body -Encoding ascii
            }
          }

          foreach ($requiredTool in @("msgfmt", "msgmerge", "xgettext")) {
            if (-not (Test-Path -LiteralPath (Join-Path $shimDir "$requiredTool.cmd"))) {
              throw "MSYS gettext host tool is missing: $requiredTool"
            }
          }

          $env:PATH = "$shimDir;$env:PATH"
          $shimDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & msgfmt --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Pin Craft to this public source commit
        shell: pwsh
        run: |
          & .\packaging\windows\prepare-craft-blueprint.ps1 -CraftRoot $env:CRAFT_ROOT -Commit "${{ github.sha }}"

      - name: Build Kdenlive and all required runtime files
        shell: pwsh
        run: |
          $expectedMsgfmt = Join-Path $env:RUNNER_TEMP "firaw-gettext-tools\msgfmt.cmd"
          $resolvedMsgfmt = (Get-Command msgfmt -ErrorAction Stop).Source
          if (-not [string]::Equals($resolvedMsgfmt, $expectedMsgfmt, [StringComparison]::OrdinalIgnoreCase)) {
            throw "Unexpected gettext host tool: $resolvedMsgfmt"
          }

          $craft = Join-Path $env:CRAFT_ROOT "craft\bin\craft.py"
          # Dependencies may come from KDE's official binary cache. The custom
          # commit target has no matching cached Kdenlive package, so Craft
          # still compiles the application itself from this repository.
          python $craft --ci-mode --options "[CodeSigning]Enabled=False" $env:CRAFT_PACKAGE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          python $craft --ci-mode --options "[CodeSigning]Enabled=False" dev-utils/innosetup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Resolve Craft build directory and release version
        id: metadata
        shell: pwsh
        run: |
          $craft = Join-Path $env:CRAFT_ROOT "craft\bin\craft.py"
          $buildDirectory = (python $craft --ci-mode --get "buildDir()" $env:CRAFT_PACKAGE | Out-String).Trim()
          if (-not (Test-Path -LiteralPath $buildDirectory)) {
            throw "Craft returned an invalid build directory: $buildDirectory"
          }

          $version = "26.11.70-firaw.${{ github.run_number }}"
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}" -replace '^v', ''
          }

          "build_directory=$buildDirectory" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "Build directory: $buildDirectory"
          "Version: $version"

      - name: Create the Firawynix installer
        shell: pwsh
        run: |
          & .\packaging\windows\build-installer.ps1 -Version "${{ steps.metadata.outputs.version }}" -BuildDirectory "${{ steps.metadata.outputs.build_directory }}" -CraftRoot $env:CRAFT_ROOT -PublicBuild

      - name: Record source and artifact provenance
        shell: pwsh
        run: |
          $dist = Join-Path $env:GITHUB_WORKSPACE "dist\windows"
          $installer = Join-Path $dist "Firawynix-Kdenlive-Setup-x64.exe"
          $provenance = [ordered]@{
            repository = "${{ github.server_url }}/${{ github.repository }}"
            commit = "${{ github.sha }}"
            workflow = "${{ github.workflow_ref }}"
            run = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            version = "${{ steps.metadata.outputs.version }}"
            sha256 = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          $provenance | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $dist "provenance.json") -Encoding utf8
          Get-Content -LiteralPath (Join-Path $dist "provenance.json")

      - name: Upload unsigned Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firawynix-kdenlive-windows-x64-${{ github.sha }}
          path: |
            dist/windows/Firawynix-Kdenlive-Setup-x64.exe
            dist/windows/Firawynix-Kdenlive-Setup-x64.exe.sha256
            dist/windows/update.json
            dist/windows/provenance.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
